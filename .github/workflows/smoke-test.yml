name: Post-deploy smoke test

# Originally tried triggering on `deployment_status` (fires when Vercel's
# integration reports a deploy finished) — that's the "correct" way to do
# this, but it never actually fired in practice despite Vercel posting a
# successful deployment_status via its GitHub App. Rather than debug
# GitHub's event delivery further, this uses push (which this repo's CI
# workflow already proves fires reliably) plus a wait for Vercel's build
# to finish, and checks the known stable production URL directly.
on:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Vercel deploy to finish
        run: sleep 90
      # Update this URL once paisacalc.in is connected as the production domain.
      - run: npm run smoke-test -- "https://paisacalc-beta.vercel.app"
