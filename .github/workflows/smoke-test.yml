name: Post-deploy smoke test

# Vercel's GitHub integration posts a deployment_status event once a
# deploy finishes — this runs the smoke test against that exact
# deployment's URL, not a guessed one, so it works for both production
# and preview deploys.
on:
  deployment_status

jobs:
  smoke-test:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke-test -- "${{ github.event.deployment_status.target_url }}"
